<div class="loader" id="loader"><div class="star">✦</div><p>GATHERING THE STARS</p></div><canvas id="scene"></canvas><header class="top"><div class="brand">✧ &nbsp; NOËL ATELIER</div><div class="top-right">AN INTERACTIVE CHRISTMAS EXPERIENCE</div></header><div class="title"><div class="eyebrow">A LITTLE MAGIC FOR YOU</div><h1>Merry Christmas</h1><p>TO: <span id="recipientText">YOU</span></p></div><div class="side">A MOMENT<br>TO REMEMBER<br>✦ &nbsp; 2026</div><button id="panelToggle" aria-expanded="true" aria-controls="controlPanel" aria-label="隐藏控制面板" title="隐藏控制面板">›</button><aside class="panel" id="controlPanel"><h2>A little magic</h2><small>写下你的圣诞祝福</small><label class="recipient-label" for="recipientInput">写给谁<input class="recipient-input" id="recipientInput" type="text" maxlength="30" value="YOU" placeholder="输入名字"></label></aside><footer class="bottom"><span><strong>Make a wish.</strong><br>LET THE MAGIC BEGIN</span><span>MADE OF LIGHT & LITTLE WONDERS &nbsp; ✦</span><span>PRESS H TO HIDE CONTROLS</span></footer>
<script type="module">
import * as THREE from 'three';import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
const canvas=document.querySelector('#scene'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x020409);const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1,15);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,.55,.2));scene.add(new THREE.AmbientLight(0x7188ac,1));const warm=new THREE.SpotLight(0xffca75,40);warm.position.set(-5,8,8);scene.add(warm);const cool=new THREE.SpotLight(0x79caff,45);cool.position.set(6,5,5);scene.add(cool);
const group=new THREE.Group();group.position.y=-.65;scene.add(group);const count=12000, pos=new Float32Array(count*3), tree=[], nebula=[], photo=[], colors=new Float32Array(count*3);for(let i=0;i<count;i++){let t=Math.random(),y=t*7-3.3,spiral=i%3===0,a=spiral?t*36+(Math.random()-.5)*.65:Math.random()*Math.PI*2,r=(1-t)*2.8*(spiral?1:(.45+Math.random()*.65))+.03;y+=(Math.random()-.5)*(spiral?.12:.22);tree.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));let rr=2+Math.random()*5,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);nebula.push(new THREE.Vector3(rr*Math.sin(ph)*Math.cos(th),rr*Math.cos(ph)*.65,rr*Math.sin(ph)*Math.sin(th)));let edge=Math.floor(Math.random()*4),u=(Math.random()-.5);photo.push(new THREE.Vector3(edge<2?(edge?1:-1)*2.15:u*4.3,edge<2?u*3:(edge===2?1:-1)*1.5,(Math.random()-.5)*.55));pos.set([tree[i].x,tree[i].y,tree[i].z],i*3);let c=new THREE.Color().setHSL(.53+Math.random()*.08,.7,.55+Math.random()*.4);colors.set([c.r,c.g,c.b],i*3)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(colors,3));const points=new THREE.Points(geo,new THREE.PointsMaterial({size:.025,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));group.add(points);
const hs=new THREE.Shape();hs.moveTo(0,-.3);hs.bezierCurveTo(-.8,.15,-.55,.65,0,.35);hs.bezierCurveTo(.55,.65,.8,.15,0,-.3);const star=new THREE.Mesh(new THREE.ShapeGeometry(hs),new THREE.MeshBasicMaterial({color:0xdedbff,side:THREE.DoubleSide}));star.position.y=4.05;group.add(star);const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<1300;i++){sp.push((Math.random()-.5)*27,(Math.random()-.5)*16,-4-Math.random()*8)}sg.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xc4e9ff,size:.035,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false})));const frame=new THREE.Group();frame.visible=false;group.add(frame);const gold=new THREE.MeshStandardMaterial({color:0xd4af37,metalness:.8,roughness:.25});function bar(w,h,x,y){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.14),gold);m.position.set(x,y,0);frame.add(m)}bar(4.2,.12,0,1.5);bar(4.2,.12,0,-1.5);bar(.12,3,-2.1,0);bar(.12,3,2.1,0);const pic=new THREE.Mesh(new THREE.PlaneGeometry(4,2.8),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));pic.position.z=-.02;frame.add(pic);function setImage(img){const c=document.createElement('canvas');c.width=1000;c.height=700;const x=c.getContext('2d');if(img){let s=Math.max(1000/img.width,700/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(1000-w)/2,(700-h)/2,w,h)}else{x.fillStyle='#071421';x.fillRect(0,0,1000,700);let g=x.createRadialGradient(500,320,0,500,320,500);g.addColorStop(0,'#193b54');g.addColorStop(1,'#030913');x.fillStyle=g;x.fillRect(0,0,1000,700);x.fillStyle='#e3c77b';for(let i=0;i<170;i++){x.globalAlpha=Math.random();x.fillRect(Math.random()*1000,Math.random()*700,2,2)}x.globalAlpha=1;x.textAlign='center';x.font='40px Georgia';x.fillText('✦',500,230);x.font='68px Georgia';x.fillText('JOYEUX NOEL',500,360);x.font='20px Georgia';x.fillText('M A K E   A   W I S H',500,420)}if(pic.material.map)pic.material.map.dispose();pic.material.map=new THREE.CanvasTexture(c);pic.material.needsUpdate=true}setImage();
let mode='tree',targetX=0,targetY=0,drag=false,lastX=0,lastY=0;canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){targetY+=(e.clientX-lastX)*.008;targetX+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY}});const toggle=document.querySelector('#panelToggle'),panel=document.querySelector('#controlPanel');function togglePanel(){const hide=panel.style.display!=='none';panel.style.display=hide?'none':'';toggle.textContent=hide?'‹':'›';toggle.setAttribute('aria-label',hide?'显示控制面板':'隐藏控制面板');toggle.title=hide?'显示控制面板':'隐藏控制面板';toggle.setAttribute('aria-expanded',String(!hide))}toggle.onclick=togglePanel;document.querySelector('#recipientInput').addEventListener('input',e=>{document.querySelector('#recipientText').textContent=e.target.value||'YOU'});window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h' && e.target.tagName!=='INPUT')togglePanel()});function animate(){requestAnimationFrame(animate);let arr=mode==='tree'?tree:mode==='nebula'?nebula:photo;for(let i=0;i<count;i++){let j=i*3;pos[j]+=(arr[i].x-pos[j])*.035;pos[j+1]+=(arr[i].y-pos[j+1])*.035;pos[j+2]+=(arr[i].z-pos[j+2])*.035}geo.attributes.position.needsUpdate=true;group.rotation.y+=(targetY-group.rotation.y)*.04;group.rotation.x+=(targetX-group.rotation.x)*.04;points.rotation.y+=mode==='tree'?.001:0;frame.visible=mode==='photo';star.visible=mode==='tree';composer.render()}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});document.querySelector('#loader').classList.add('done');
