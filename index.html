<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣诞树 · Christmas in starlight</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');
*{box-sizing:border-box}body{margin:0;background:#020409;color:#fceea7;font-family:'Noto Sans SC',sans-serif;overflow:hidden}canvas#scene{position:fixed;inset:0;width:100%;height:100%}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.68) 100%)}.top,.bottom,.panel,.side{position:fixed;z-index:2}.top{top:35px;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.3em;color:#c9b981}.brand{font-family:'Cormorant Garamond';font-size:18px;letter-spacing:.18em;color:#fceea7}.top-right{border:1px solid #8b7a46;padding:9px 14px;border-radius:30px}.title{position:fixed;z-index:2;top:10%;width:100%;text-align:center;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.45em;color:#d4af37}.title h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,7vw,100px);line-height:.9;margin:15px 0 10px;letter-spacing:.035em;background:linear-gradient(#fff,#a5d9ff);color:transparent;background-clip:text;text-shadow:0 0 38px #88bfff66}.title p{font-size:11px;letter-spacing:.32em;color:#d4c798}.side{left:5%;top:43%;font-size:10px;letter-spacing:.2em;line-height:2.2;color:#a99b71}.side:before{content:'';display:block;width:1px;height:55px;background:#d4af37;margin-bottom:18px}.panel{right:5%;top:36%;width:205px;padding:22px;background:rgba(7,12,19,.68);border:1px solid #d4af3744;backdrop-filter:blur(12px)}.panel h2{font-family:'Cormorant Garamond';font-size:21px;font-weight:400;margin:0 0 5px;color:#fceea7}.panel small{color:#8b9dac;font-size:10px}.row{display:flex;align-items:center;gap:12px;margin-top:19px;font-size:11px;color:#d0d1c3}.icon{font-size:17px;color:#e3c875;width:25px}.row b{display:block;color:#f4e4aa;font-weight:400}.row span:last-child{line-height:1.7}.actions{display:flex;gap:8px;margin-top:20px;flex-direction:column}button,.upload{cursor:pointer;border:1px solid #b99b50;background:#d4af3717;color:#fceea7;padding:11px;font:inherit;font-size:10px;letter-spacing:.12em;text-align:center}button:hover,.upload:hover{background:#d4af3739}input{display:none}.status{margin-top:12px;font-size:10px;line-height:1.6;color:#91b7ca}.bottom{bottom:30px;left:5%;right:5%;display:flex;justify-content:space-between;align-items:end;color:#a89a70;font-size:10px;letter-spacing:.2em}.bottom strong{font-family:'Cormorant Garamond';font-size:18px;font-weight:400;color:#fceea7}.hidden-ui .panel,.hidden-ui .side,.hidden-ui .bottom,.hidden-ui .top{display:none}.loader{position:fixed;z-index:10;inset:0;background:#020409;display:grid;place-content:center;text-align:center;transition:opacity .8s}.loader.done{opacity:0;pointer-events:none}.loader .star{font-size:34px;color:#d4af37;animation:pulse 1s infinite alternate}.loader p{letter-spacing:.4em;font-size:10px;color:#fceea7}@keyframes pulse{to{opacity:.3;transform:scale(.7)}}@media(max-width:700px){.side,.top-right{display:none}.top{top:20px}.title{top:9%}.panel{top:auto;bottom:65px;right:4%;width:180px;padding:14px}.row{margin-top:10px}.bottom{bottom:20px}.bottom span:last-child{display:none}}
.title{top:40%;left:5%;width:auto;text-align:left}.title h1{font-size:clamp(24px,3vw,42px);font-style:italic;line-height:1.1}.title p{font-family:Georgia;font-size:18px;letter-spacing:.05em}.eyebrow{display:none}.top,.side,.bottom{opacity:.45}.panel{opacity:.35;transition:opacity .3s}.panel:hover,.panel:focus-within{opacity:1}@media(max-width:700px){.title{top:20%;left:5%}.title h1{font-size:25px}.panel{opacity:.75}}#panelToggle{position:fixed;z-index:4;right:5%;top:30%;width:40px;height:40px;padding:0;border:1px solid #d4af3766;border-radius:50%;background:#071019cc;color:#fceea7;font-size:19px;line-height:1;backdrop-filter:blur(10px);transition:background .2s,transform .2s}#panelToggle:hover{background:#55471f;transform:scale(1.06)}.recipient-label{display:block;margin-top:18px;font-size:10px;letter-spacing:.1em;color:#d0d1c3}.recipient-input{display:block;width:100%;margin-top:7px;padding:9px;background:#071019;border:1px solid #d4af3766;color:#fceea7;font:inherit;font-size:12px;outline:none}.recipient-input:focus{border-color:#fceea7}@media(max-width:700px){#panelToggle{top:auto;bottom:65px;right:4%;transform:translateY(-100%)}#panelToggle:hover{transform:translateY(-100%)}.panel{max-height:65vh;overflow:auto}}</style></head><body>
<div class="loader" id="loader"><div class="star">✦</div><p>GATHERING THE STARS</p></div><canvas id="scene"></canvas><header class="top"><div class="brand">✧ &nbsp; NOËL ATELIER</div><div class="top-right">AN INTERACTIVE CHRISTMAS EXPERIENCE</div></header><div class="title"><div class="eyebrow">A LITTLE MAGIC FOR YOU</div><h1>Merry Christmas</h1><p>TO: <span id="recipientText">YOU</span></p></div><div class="side">A MOMENT<br>TO REMEMBER<br>✦ &nbsp; 2026</div><button id="panelToggle" aria-expanded="true" aria-controls="controlPanel" aria-label="隐藏控制面板" title="隐藏控制面板">›</button><aside class="panel" id="controlPanel"><h2>A little magic</h2><small>写下你的圣诞祝福</small><label class="recipient-label" for="recipientInput">写给谁<input class="recipient-input" id="recipientInput" type="text" maxlength="30" value="YOU" placeholder="输入名字"></label></aside><footer class="bottom"><span><strong>Make a wish.</strong><br>LET THE MAGIC BEGIN</span><span>MADE OF LIGHT & LITTLE WONDERS &nbsp; ✦</span><span>PRESS H TO HIDE CONTROLS</span></footer>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let w,h,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();window.addEventListener('resize',resize);
const particles=Array.from({length:6000},(_,i)=>{let t=Math.random(),spiral=i%3===0;return {t,a:spiral?t*35+(Math.random()-.5)*.65:Math.random()*Math.PI*2,r:(1-t)*(spiral?1:.4+Math.random()*.65),size:.35+Math.random()*.9,alpha:.3+Math.random()*.7}});const stars=Array.from({length:250},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2,a:Math.random()}));let angle=0,drag=false,last=0;canvas.addEventListener('pointerdown',e=>{drag=true;last=e.clientX});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-last)*.01;last=e.clientX}});
function draw(time){ctx.clearRect(0,0,w,h);ctx.fillStyle='#020409';ctx.fillRect(0,0,w,h);for(const s of stars){ctx.fillStyle=`rgba(202,233,255,${s.a*(.65+.35*Math.sin(time*.001+s.x*50))})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,7);ctx.fill()}let cx=w*(w<700?.5:.53),cy=h*.55,scale=Math.min(w*.42,h*.38);ctx.globalCompositeOperation='lighter';for(const p of particles){let a=p.a+angle+time*.00009,x=cx+Math.cos(a)*p.r*scale,y=cy+(0.5-p.t)*scale*1.9+Math.sin(a)*p.r*scale*.18;ctx.fillStyle=`rgba(155,224,255,${p.alpha})`;ctx.fillRect(x,y,p.size,p.size)}ctx.shadowColor='#c6d4ff';ctx.shadowBlur=22;ctx.fillStyle='#e6e8ff';ctx.font=`${Math.max(18,scale*.12)}px serif`;ctx.textAlign='center';ctx.fillText('♥',cx,cy-scale*.99);ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}requestAnimationFrame(draw);
const toggle=document.querySelector('#panelToggle'),panel=document.querySelector('#controlPanel');function togglePanel(){let hide=panel.style.display!=='none';panel.style.display=hide?'none':'';toggle.textContent=hide?'‹':'›';toggle.setAttribute('aria-expanded',String(!hide));toggle.setAttribute('aria-label',hide?'显示控制面板':'隐藏控制面板')}toggle.onclick=togglePanel;document.querySelector('#recipientInput').addEventListener('input',e=>document.querySelector('#recipientText').textContent=e.target.value||'YOU');window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&e.target.tagName!=='INPUT')togglePanel()});document.querySelector('#loader').classList.add('done');
</script></body></html>
